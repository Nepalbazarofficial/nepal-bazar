
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nepal Bazar</title>
<style>
body{margin:0;font-family:Arial;background:#f4f7f5;color:#18352b}
header{background:#087f5b;color:white;padding:18px;text-align:center}
.search{padding:15px;display:flex;gap:8px}
input{padding:13px;border:1px solid #ddd;border-radius:8px;flex:1}
button{background:#087f5b;color:white;border:0;padding:12px;border-radius:8px}
main{padding:15px}
h2{color:#087f5b}
.categories,.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.item{background:white;padding:18px;border-radius:12px;text-align:center}
.item span{font-size:35px}
.price{color:#087f5b;font-weight:bold}
footer{text-align:center;padding:25px;color:#777}
</style>
</head>
<body>
<header>
<h1>🇳🇵 NEPAL BAZAR</h1>
<p>Buy & Sell Everything in Nepal</p>
</header>
<div class="search">
<input placeholder="Search products...">
<button>Search</button>
</div>
<main>
<h2>Categories</h2>
<div class="categories">
<div class="item">📱<p>Mobiles</p></div>
<div class="item">👕<p>Clothing</p></div>
<div class="item">🏠<p>Home</p></div>
<div class="item">🏍️<p>Vehicles</p></div>
<div class="item">🏡<p>Property</p></div>
<div class="item">🛋️<p>Furniture</p></div>
<div class="item">📚<p>Books</p></div>
<div class="item">📦<p>Other</p></div>
</div>
<h2>Featured Products</h2>
<div class="products">
<div class="item">
<span>📱</span>
<h3>Mobile Phone</h3>
<p class="price">NPR 25,000</p>
<button>View Product</button>
</div>
<div class="item">
<span>🛋️</span>
<h3>Furniture</h3>
<p class="price">NPR 5,000</p>
<button>View Product</button>
</div>
</div>
<h2>Sell Your Products</h2>
<div class="item">
<p>Want to sell something?</p>
<button>Start Selling</button>
</div>
</main>
<footer>© 2026 Nepal Bazar</footer>
</body>
</html>
